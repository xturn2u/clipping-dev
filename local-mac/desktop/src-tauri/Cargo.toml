[package]
name = "localshorts-mac-desktop"
version = "0.1.0"
description = "LocalShorts for Apple Silicon"
authors = ["xturn2u"]
edition = "2021"

[lib]
name = "localshorts_mac_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

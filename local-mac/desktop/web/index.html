<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LocalShorts</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <span class="eyebrow">LOCAL • APPLE SILICON</span>
        <h1>LocalShorts</h1>
        <p>Video rein. Lokale KI analysiert. Vertikale Clips raus.</p>
      </div>
      <div id="health" class="status">Backend wird geprüft …</div>
    </header>

    <section class="card input-card">
      <label for="source">YouTube-Link oder lokaler Dateipfad</label>
      <div class="source-row">
        <input id="source" placeholder="https://youtube.com/watch?v=… oder /Users/…/video.mp4" />
        <button id="runBtn">Analysieren</button>
      </div>
      <div class="options">
        <label>Clips
          <select id="clips">
            <option>3</option><option selected>5</option><option>7</option><option>10</option>
          </select>
        </label>
        <label>Ollama
          <input id="ollama" value="qwen3:4b" />
        </label>
      </div>
    </section>

    <section id="progressCard" class="card hidden">
      <div class="progress-head">
        <strong id="progressMessage">Startet …</strong>
        <span id="progressPct">0%</span>
      </div>
      <div class="bar"><div id="barFill"></div></div>
      <div id="error" class="error"></div>
    </section>

    <section>
      <div class="results-head">
        <h2>Ergebnisse</h2>
        <span id="resultCount">Noch keine Clips</span>
      </div>
      <div id="results" class="grid"></div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>

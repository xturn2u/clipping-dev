[project]
name = "localshorts-mac"
version = "0.1.0"
description = "Local-first short video generator for Apple Silicon"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mlx-whisper>=0.4.0",
  "yt-dlp>=2026.1.0",
  "ollama>=0.6.0",
]

[project.scripts]
localshorts = "localshorts.cli:main"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
